services:
  - type: web
    name: rentwheels
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --config gunicorn_config.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: rentwheels-data
      mountPath: /var/data
      sizeGB: 1
